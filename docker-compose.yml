# All four Go services share a build context of ./services so that the shared
# `pkg` module, referenced through a `replace` directive, is reachable from
# inside each build. See services/user-service/Dockerfile for detail.
#
# Boot order is enforced with conditions rather than plain depends_on: services
# wait for Postgres to pass its healthcheck and for migrations to run to
# completion, so a fresh `make up` converges without manual steps.
#
# Only the gateway and Postgres publish ports. The three services behind the
# gateway are reachable only on the internal compose network, so the gateway is
# genuinely the sole entry point rather than merely the intended one.

services:
  postgres:
    container_name: postgres_db
    image: postgres:15
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: event_ticketing
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d event_ticketing"]
      interval: 3s
      timeout: 3s
      retries: 20

  # KRaft mode: Kafka's own consensus protocol, no ZooKeeper. That is what makes
  # running a broker here a handful of environment variables rather than a second
  # stateful service to operate.
  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Single broker, so nothing to replicate onto.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  migrate:
    image: migrate/migrate:v4.17.1
    volumes:
      - ./db/migrations:/migrations:ro
    command:
      - "-path"
      - "/migrations"
      - "-database"
      - "postgres://admin:password@postgres:5432/event_ticketing?sslmode=disable"
      - "up"
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  user-service:
    build:
      context: ./services
      dockerfile: user-service/Dockerfile
    # No published ports: the gateway is the only entry point. Use
    # `make up-debug` to expose 8081 on the host for direct debugging.
    environment:
      DATABASE_URL: postgres://admin:password@postgres:5432/event_ticketing?sslmode=disable
      JWT_SECRET: my_secret_key_123
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  event-service:
    build:
      context: ./services
      dockerfile: event-service/Dockerfile
    # No published ports: the gateway is the only entry point. Use
    # `make up-debug` to expose 8082 on the host for direct debugging.
    environment:
      DATABASE_URL: postgres://admin:password@postgres:5432/event_ticketing?sslmode=disable
      JWT_SECRET: my_secret_key_123
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  ticket-service:
    build:
      context: ./services
      dockerfile: ticket-service/Dockerfile
    # No published ports: the gateway is the only entry point. Use
    # `make up-debug` to expose 8083 on the host for direct debugging.
    environment:
      DATABASE_URL: postgres://admin:password@postgres:5432/event_ticketing?sslmode=disable
      JWT_SECRET: my_secret_key_123
      # Interpolated from the gitignored root .env, never written here. Empty is
      # allowed: with no key the service falls back to the fake provider, so the
      # stack still starts for anyone who clones this without a Stripe account.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      # Exposed so the capacity test can move it. The purchase path holds a
      # connection for the length of a locking transaction, so this caps how
      # many purchases can be in flight at once.
      DB_MAX_CONNS: ${DB_MAX_CONNS:-25}
      KAFKA_BROKERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy

  api-gateway:
    build:
      context: ./services
      dockerfile: api-gateway/Dockerfile
    ports:
      - "8000:8000"
    environment:
      USER_SERVICE_URL: http://user-service:8081
      EVENT_SERVICE_URL: http://event-service:8082
      TICKET_SERVICE_URL: http://ticket-service:8083
      JWT_SECRET: my_secret_key_123
    # service_healthy, not service_started: each service image carries a
    # HEALTHCHECK that probes its own /health/ready, so the gateway only starts
    # once its upstreams can actually serve.
    depends_on:
      user-service:
        condition: service_healthy
      event-service:
        condition: service_healthy
      ticket-service:
        condition: service_healthy

  # The consumer side. A separate process rather than a goroutine in
  # ticket-service, because an independent consumer group is the thing worth
  # demonstrating -- it can be scaled, restarted and lag-monitored on its own.
  notification-worker:
    build:
      context: ./services
      dockerfile: ticket-service/Dockerfile.worker
    environment:
      DATABASE_URL: postgres://admin:password@postgres:5432/event_ticketing?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      DB_MAX_CONNS: 5
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy

volumes:
  postgres_data:
